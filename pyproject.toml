[project]
name = "rimel-web"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ag2>=1.1.2",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "ddgs>=9.16.0",
    "flask>=3.1.3",
    "flask-limiter>=4.1.1",
    "gunicorn>=26.2.0",
    "openai>=3.29.0",
    "pandas>=3.0.6",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "supabase>=2.32.0",
    "torch>=2.14.1",
    "wikipedia>=1.4.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
